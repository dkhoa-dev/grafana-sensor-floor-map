services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    # The scaffold in .config still carries the plugin's first id; these follow the current one.
    container_name: 'dkhoa-sensorfloormap-panel'
    # Default to a Grafana that satisfies grafanaDependency in src/plugin.json; the scaffold default is older.
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-13.3.0}
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_LOG_FILTERS: plugin.dkhoa-sensorfloormap-panel:debug
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: dkhoa-sensorfloormap-panel
    depends_on:
      - clickhouse

  # Demo sensor data for the ClickHouse dashboard. The readings are a view over now(), so they stay live.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: 'dkhoa-sensorfloormap-clickhouse'
    environment:
      CLICKHOUSE_DB: demo
      CLICKHOUSE_USER: grafana
      CLICKHOUSE_PASSWORD: grafana
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./dev/clickhouse:/docker-entrypoint-initdb.d:ro
