# Interactive Claude Code: runs only when a comment, review comment or new issue
# mentions @claude. GitHub only starts it for users with write access.
#
# Hardening (pilot):
# - GitHub-hosted runner only.
# - Authenticates to GitHub through the Claude GitHub App (posts as claude[bot]);
#   id-token is only used to exchange the run's OIDC token for the App token.
#   The App installation must include this repository.
# - Claude only reads comments from the listed maintainers.
# - The App token has no `workflows` permission, so GitHub blocks workflow file
#   changes (see additional_permissions). Edit deny rules for .github, .git and
#   .claude add defense in depth (see claude_args).
# - The action writes the App token into the origin URL in .git/config and into
#   Claude's environment. Claude commits through the GitHub API instead of git,
#   gets no Bash, and cannot read .git or /proc, so a prompt in an issue or PR
#   body cannot copy the token into a commit (see use_commit_signing).
# - Pull requests from forks are refused before Claude starts.
# - No other repository secret is exposed to this job.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # The API commit tool reads each file from disk and follows symlinks, so
      # a fork PR could add a link to .git/config and have Claude commit the
      # token. Run only on PRs whose head branch is in this repository.
      - name: Refuse pull requests from forks
        if: github.event.issue.pull_request || github.event.pull_request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          head_repo=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.repo.full_name // ""')
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Claude does not run on pull requests from forks (head repository: ${head_repo:-deleted})."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: 'khoapmdx,pmdk-bot'
          exclude_comments_by_actor: 'dependabot[bot]'
          # Commits go through the action's GitHub API tool, so the action does
          # not give Claude `git add`, `git commit` or the push script. With
          # git, `git commit -F .git/config` could publish the token. Do not
          # set ssh_signing_key: it brings those git tools back.
          use_commit_signing: true
          # The action requests the App token Claude pushes with for exactly
          # these permissions. Without `workflows`, GitHub rejects any push or
          # API write that changes a file under .github/workflows. If this input
          # is empty, the action requests no permission set and the token
          # exchange service picks one, so keep it non-empty.
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
          # Defense in depth for the token: no Bash at all (acceptEdits would
          # otherwise auto-approve cp, mv, sed and similar commands), and no
          # reads of .git (the token in the origin URL) or /proc (the token in
          # Claude's environment and arguments). One Edit rule covers Edit,
          # Write, MultiEdit and NotebookEdit. .claude is denied because a
          # settings file written there could allow tools or add hooks.
          claude_args: |
            --max-turns 10
            --disallowedTools "Bash,Read(.git/**),Read(//proc/**),Edit(.github/**),Edit(.git/**),Edit(.claude/**)"
