# Interactive Claude Code: runs only when a comment, review comment or new issue
# mentions @claude. GitHub only starts it for users with write access.
#
# Hardening (pilot):
# - GitHub-hosted runner only.
# - Authenticates to GitHub through the Claude GitHub App (posts as claude[bot]);
#   id-token is only used to exchange the run's OIDC token for the App token.
#   The App installation must include this repository.
# - Claude only reads comments from the listed maintainers.
# - The App token has no `workflows` permission, so GitHub blocks workflow file
#   changes (see additional_permissions). Edit deny rules for .github, .git and
#   .claude add defense in depth (see claude_args).
# - No other repository secret is exposed to this job.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: 'khoapmdx,pmdk-bot'
          exclude_comments_by_actor: 'dependabot[bot]'
          # The action requests the App token Claude pushes with for exactly
          # these permissions. Without `workflows`, GitHub rejects any push or
          # API write that changes a file under .github/workflows. If this input
          # is empty, the action requests no permission set and the token
          # exchange service picks one, so keep it non-empty.
          additional_permissions: |
            contents: write
            pull_requests: write
            issues: write
          # Defense in depth only: acceptEdits auto-approves mv, cp, mkdir, rm
          # and similar commands, which these rules do not cover. One Edit rule
          # covers Edit, Write, MultiEdit, NotebookEdit and Bash redirect/tee
          # targets. .git and .claude are denied because a hook or settings file
          # written there would turn the allowed `git commit` into arbitrary
          # commands.
          claude_args: |
            --max-turns 10
            --disallowedTools "Edit(.github/**),Edit(.git/**),Edit(.claude/**)"
