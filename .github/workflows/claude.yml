# Interactive Claude Code: runs only when a comment, review comment or new issue
# mentions @claude. GitHub only starts it for users with write access.
#
# Hardening (pilot):
# - GitHub-hosted runner only.
# - Authenticates to GitHub through the Claude GitHub App (posts as claude[bot]);
#   id-token is only used to exchange the run's OIDC token for the App token.
#   The App installation must include this repository.
# - Claude only reads comments from the listed maintainers.
# - Claude cannot write under .github, .git or .claude (see claude_args).
# - No other repository secret is exposed to this job.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          include_comments_by_actor: 'khoapmdx,pmdk-bot'
          exclude_comments_by_actor: 'dependabot[bot]'
          # The App token can write workflow files, so Claude must never write
          # under .github. One Edit rule covers every built-in file-writing tool
          # (Edit, Write, MultiEdit, NotebookEdit) and Bash redirect/tee targets;
          # Write(...)/MultiEdit(...)/NotebookEdit(...) path rules never match.
          # .git and .claude are denied too: a hook or settings file written
          # there would turn the allowed `git commit` into arbitrary commands.
          # Tag mode allows no other Bash than git add/commit/rm and the push
          # wrapper. Re-check this list before enabling use_commit_signing or
          # adding --allowedTools: both change the tool set.
          claude_args: |
            --max-turns 10
            --disallowedTools "Edit(.github/**),Edit(.git/**),Edit(.claude/**)"
