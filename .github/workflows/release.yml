# This GitHub Action automates the process of building Grafana plugins.
# (For more information, see https://github.com/grafana/plugin-actions/blob/main/build-plugin/README.md)
name: Release

on:
  push:
    tags:
      - 'v*' # Run workflow on version tags, e.g. v1.0.0.
  # Run by tag-release.yml on the tag it creates, since a tag pushed with GITHUB_TOKEN starts no workflow.
  workflow_dispatch:

permissions: read-all

jobs:
  release:
    permissions:
      contents: write
      # For the build provenance attestation.
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: grafana/plugin-actions/build-plugin@build-plugin/v1.2.1
        with:
          # Lets Grafana's plugin review verify that the archive was built from this repository.
          attestation: true
          # @grafana/sign-plugin 4 needs Node >=24.5; the action defaults to Node 20.
          node-version: '24'
          # Signs the archive (adds MANIFEST.txt). Without it the release zip is unsigned.
          # Token setup: https://grafana.com/developers/plugin-tools/publish-a-plugin/sign-a-plugin#generate-an-access-policy-token
          policy_token: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
